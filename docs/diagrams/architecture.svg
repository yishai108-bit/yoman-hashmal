    <rect x="750" y="235" width="240" height="56" rx="8"/><rect x="750" y="305" width="240" height="56" rx="8"/>
    <rect x="750" y="375" width="240" height="56" rx="8"/>
  </g>
  <g fill="#1f2937" text-anchor="middle">
    <text x="870" y="118">תעודת משלוח</text><text x="870" y="138" font-size="12" fill="#6b7280">צילום → AI → עריכה → שמירה</text>
    <text x="870" y="188">משיכת כבל</text><text x="870" y="208" font-size="12" fill="#6b7280">תוף, מטרים, אזור, צוות</text>
