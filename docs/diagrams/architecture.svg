    <text x="870" y="398">התקדמות</text><text x="870" y="418" font-size="12" fill="#6b7280">כמה בוצע היום בכל פעילות</text>
  </g>
  <!-- store column (middle) -->
  <text x="500" y="78" text-anchor="middle" font-weight="bold" fill="#374151">מאגר המופע (אוספים)</text>
  <rect x="360" y="90" width="280" height="350" rx="12" fill="#f1ede2" stroke="#9a8c5a" stroke-width="1.5"/>
  <g fill="#1f2937" text-anchor="middle">
