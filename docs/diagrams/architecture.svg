    <text x="130" y="530">הורדות</text><text x="130" y="552">CSV · PDF · גיבוי JSON</text>
  </g>
  <text x="505" y="610" text-anchor="middle" font-size="12" fill="#6b7280">קובץ HTML אחד · עברית RTL · טלפון 400px · 44px · פס «אין חיבור» · גרסה 1 = מלאי + כבלים + אנשים + סטטוס + דוח</text>
  <defs>
