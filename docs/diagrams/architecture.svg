  </g>
  <g stroke="#3b6e5c" stroke-width="1.5" fill="none" marker-end="url(#b)">
    <path d="M360 120 L260 120"/><path d="M360 160 L260 180"/><path d="M360 195 L260 240"/><path d="M360 225 L260 300"/><path d="M360 262 L260 360"/><path d="M360 300 L260 420"/>
  </g>
  <!-- platform band -->
  <rect x="20" y="470" width="970" height="120" rx="12" fill="#fff" stroke="#9a8c5a" stroke-dasharray="6 4"/>
  <text x="505" y="498" text-anchor="middle" font-weight="bold" fill="#374151">הפלטפורמה (artifact ב-Claude, או אירוח עצמאי + Supabase אחרי הפיילוט)</text>
  <g fill="#1f2937" font-size="13" text-anchor="middle">
