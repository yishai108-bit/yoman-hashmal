<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" direction="rtl" font-family="Arial, Heebo, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="620" fill="#faf8f3"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">יומן חשמל · מודולים וזרימת נתונים</text>
  <!-- input column (right) -->
  <text x="870" y="78" text-anchor="middle" font-weight="bold" fill="#374151">קלט מהטלפון (10 דקות ביום)</text>
