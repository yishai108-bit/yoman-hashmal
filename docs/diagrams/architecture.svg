    <text x="500" y="320" font-size="13" fill="#6b7280">מילון כינויים, אזורים, ספקים</text>
    <text x="500" y="360" font-size="13" fill="#6b7280">log: מי, מתי, מה</text>
    <text x="500" y="395" font-size="13" fill="#6b7280">מחיקה = סימון · גיבוי JSON מלא</text>
    <text x="500" y="425" font-size="13" fill="#6b7280">כל כללי החישוב בפונקציה אחת</text>
  </g>
